apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-educacao-superior
  namespace: dashs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dash-educacao-superior
  template:
    metadata:
      labels:
        app: dash-educacao-superior
    spec:
      serviceAccountName: dataiesb-dashs
      containers:
        - name: dash-educacao-superior
          image: 248189947068.dkr.ecr.us-east-1.amazonaws.com/dash-educacao-superior:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8050
          env:
            - name: DASH_PREFIX
              value: /educacao-superior/
            - name: TRINO_HOST
              value: trino.trino.svc.cluster.local
            - name: TRINO_PORT
              value: "8080"
            - name: TRINO_USER
              value: funasa_reader
            - name: TRINO_CATALOG
              value: seaweedfs
            - name: TRINO_SCHEMA
              value: raw
          livenessProbe:
            httpGet:
              path: /educacao-superior/
              port: 8050
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /educacao-superior/
              port: 8050
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dash-educacao-superior
  namespace: dashs
spec:
  selector:
    app: dash-educacao-superior
  ports:
    - port: 8050
      targetPort: 8050
